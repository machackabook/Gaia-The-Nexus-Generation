name: Gaia System Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  system-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Catalog repository state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          printf '{"commit":"%s","branch":"%s","timestamp":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > artifacts/pipeline-attestation.json
          test -f config/instance-catalog.json
          test -f docs/SYSTEM-PIPELINE-V2.md

      - name: Sentinel-style policy gate
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.lock' \
            '(BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY|api[_-]?key[[:space:]]*[:=]|secret[[:space:]]*[:=])' .; then
            echo 'Potential credential material detected; review before promotion.'
            exit 1
          fi
          if find . -type f \( -name '*.sparsebundle' -o -name '*.pem' -o -name '*.key' \) -not -path './.git/*' | grep -q .; then
            echo 'Sensitive artifact type detected in repository.'
            exit 1
          fi

      - name: Validate instance catalog
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool config/instance-catalog.json >/dev/null

      - name: Provenance digest
        shell: bash
        run: |
          set -euo pipefail
          sha256sum docs/SYSTEM-PIPELINE-V2.md config/instance-catalog.json > artifacts/provenance.sha256

      - name: Upload pipeline evidence
        uses: actions/upload-artifact@v4
        with:
          name: gaia-system-pipeline-evidence
          path: artifacts/
