name: Validate ImmortalADAMWrt configuration

on:
  pull_request:
    paths:
      - 'infra/immortaladamwrt-r6080/**'
      - '.github/workflows/validate-immortaladamwrt.yml'
  push:
    branches: [main]
    paths:
      - 'infra/immortaladamwrt-r6080/**'
      - '.github/workflows/validate-immortaladamwrt.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: |
          python -m pip install --disable-pip-version-check pyyaml
      - name: Validate YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          root = Path('infra/immortaladamwrt-r6080')
          for p in root.rglob('*.yaml'):
              yaml.safe_load(p.read_text())
              print('validated', p)
          PY
      - name: Shell syntax check
        run: bash -n infra/immortaladamwrt-r6080/validation/preflight.sh
      - name: Secret-pattern guard
        run: |
          if grep -RniE '(tskey-[A-Za-z0-9]|-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----|api[_-]?key\s*[:=])' infra/immortaladamwrt-r6080; then
            echo 'Potential secret material found in public configuration.'
            exit 1
          fi
