name: Factory / Android

on:
  pull_request:
    paths:
      - "factory/android-smoke/**"
      - "factory/toolchain.json"
      - ".github/workflows/factory-android.yml"
  push:
    branches: [ main ]
    paths:
      - "factory/android-smoke/**"
      - "factory/toolchain.json"
      - ".github/workflows/factory-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        working-directory: factory/android-smoke

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Toolchain evidence
        run: |
          java -version
          gradle --version
          sdkmanager --version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Android lint
        run: gradle --no-daemon lintDebug

      - name: Android unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK and produce manifest
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee app/build/ANDROID-APK-SHA256.txt
          {
            echo "platform=android"
            echo "agp=9.4.0"
            echo "gradle=9.6.0"
            echo "jdk=17"
            echo "compileSdk=37"
            echo "buildTools=36.0.0"
            echo "commit=$GITHUB_SHA"
          } > app/build/BUILD-MANIFEST.txt

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: gaia-factory-android
          path: |
            factory/android-smoke/app/build/outputs/apk/debug/*.apk
            factory/android-smoke/app/build/ANDROID-APK-SHA256.txt
            factory/android-smoke/app/build/BUILD-MANIFEST.txt
          if-no-files-found: error
