name: GAIA Sync Fabric
on:
  pull_request:
    paths:
      - "src/gaia_sync_fabric.py"
      - "tests/test_sync_fabric.py"
      - ".github/workflows/gaia-sync-fabric.yml"
  push:
    branches:
      - "gaia-nexus/mesh-v4-1-quine-foundation"
    paths:
      - "src/gaia_sync_fabric.py"
      - "tests/test_sync_fabric.py"
      - ".github/workflows/gaia-sync-fabric.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile src/gaia_sync_fabric.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
