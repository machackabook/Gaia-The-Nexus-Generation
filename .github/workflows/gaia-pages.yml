name: GAIA Public Pages
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/gaia-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gaia-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public files
        run: |
          test -f docs/index.html
          test ! -L docs/index.html
          ! grep -RniE '(PRIVATE KEY|OPENAI_API_KEY|GEMINI_API_KEY|ghp_[A-Za-z0-9]{20})' docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
